# shopify.app.toml

name = "GWP - Gift With Purchase"
client_id = "4fd28b1f0bd91b4480cfdba0459ae16e"  
application_url = "https://fuumuui-clearing.onrender.com"
embedded = true

[access_scopes]
# 临时移除受保护权限，确保部署通过。
scopes = "write_products,read_products,write_discounts,read_discounts"

[auth]
redirect_urls = [
  "https://fuumuui-clearing.onrender.com/auth/callback",
  "https://fuumuui-clearing.onrender.com/auth/shopify/callback",
  "https://fuumuui-clearing.onrender.com/api/auth/callback"
]

[webhooks]
api_version = "2024-10"

#  [[webhooks.subscriptions]]
#  topics = [ "orders/create" ]
#  uri = "/webhooks"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks"

[app_proxy]
url = "https://fuumuui-clearing.onrender.com/api/gwp"
subpath = "gwp"
prefix = "apps"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
